name: Deploy 2D Combat Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "Current directory:"
          pwd

          echo "All index.html files:"
          find . -maxdepth 8 -name index.html -print

          echo "All demo-2d-strategy folders:"
          find . -maxdepth 8 -type d -name "demo-2d-strategy" -print

          echo "Top-level files:"
          ls -la

      - name: Prepare Pages site
        id: pages_site
        shell: bash
        run: |
          set -euo pipefail
          STRATEGY_PATH="$(find . -type f -path '*/demo-2d-strategy/index.html' -printf '%h\n' | head -n 1)"
          CARD_PATH="$(find . -type f -path '*/demo-armor-chain-cards/index.html' -printf '%h\n' | head -n 1)"

          if [ -z "$STRATEGY_PATH" ]; then
            echo "demo-2d-strategy/index.html not found"
            exit 1
          fi
          if [ -z "$CARD_PATH" ]; then
            echo "demo-armor-chain-cards/index.html not found"
            exit 1
          fi

          SITE_PATH="$RUNNER_TEMP/pages-site"
          mkdir -p "$SITE_PATH/card"
          cp -a "$STRATEGY_PATH/." "$SITE_PATH/"
          cp -a "$CARD_PATH/." "$SITE_PATH/card/"
          find "$SITE_PATH" -type f -name '.server-*.log' -delete
          touch "$SITE_PATH/.nojekyll"

          test -f "$SITE_PATH/index.html"
          test -f "$SITE_PATH/card/index.html"
          echo "Strategy entry: $SITE_PATH/index.html"
          echo "Card entry: $SITE_PATH/card/index.html"
          echo "path=$SITE_PATH" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.pages_site.outputs.path }}

      - id: deployment
        uses: actions/deploy-pages@v4
