name: Deploy 2D Combat Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "Current directory:"
          pwd

          echo "All index.html files:"
          find . -maxdepth 8 -name index.html -print

          echo "All demo-2d-strategy folders:"
          find . -maxdepth 8 -type d -name "demo-2d-strategy" -print

          echo "Top-level files:"
          ls -la

      - name: Resolve demo path
        id: demo_path
        shell: bash
        run: |
          set -euo pipefail
          DEMO_PATH="$(find . -type f -path '*/demo-2d-strategy/index.html' -printf '%h\n' | head -n 1)"
          if [ -z "$DEMO_PATH" ]; then
            echo "demo-2d-strategy/index.html not found"
            exit 1
          fi
          echo "Resolved demo path: $DEMO_PATH"
          echo "path=$DEMO_PATH" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.demo_path.outputs.path }}

      - id: deployment
        uses: actions/deploy-pages@v4
