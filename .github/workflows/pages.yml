name: Deploy 2D Combat Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "Current directory:"
          pwd

          echo "All index.html files:"
          find . -maxdepth 8 -name index.html -print

          echo "All demo-2d-strategy folders:"
          find . -maxdepth 8 -type d -name "demo-2d-strategy" -print

          echo "Top-level files:"
          ls -la

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "001.战斗/demo-2d-strategy"

      - id: deployment
        uses: actions/deploy-pages@v4
