<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M98 2D Strategy Combat Demo</title>
    <link rel="stylesheet" href="./styles.css?v=module-bingo-20260626" />
  </head>
  <body>
    <div class="demo-version" data-demo-version>Demo --</div>
    <section class="prebattle-screen" id="prebattleScreen" data-step="boss" aria-label="战前策略准备">
      <div class="prebattle-bg"></div>
      <header class="prebattle-top">
        <div class="prebattle-logo">GM</div>
        <button class="prebattle-icon-button" type="button" aria-label="返回">‹</button>
        <button class="prebattle-icon-button eye" type="button" aria-label="预览">◈</button>
      </header>

      <section class="prebattle-page boss-page" data-prebattle-page="boss" aria-label="选择Boss">
        <section class="boss-select-panel">
          <div class="prebattle-panel-head">
            <span>选择Boss</span>
          </div>
          <div class="boss-card-list" id="bossCards"></div>
          <div class="boss-intel" id="bossIntel"></div>
          <div class="boss-page-actions">
            <button class="enter-battle" id="nextLoadoutBtn" type="button">挑战</button>
          </div>
        </section>
      </section>

      <section class="prebattle-page character-page" data-prebattle-page="character" aria-label="角色信息">
        <section class="character-info-shell">
          <div class="character-portrait-stage">
            <img class="character-portrait" src="./assets/loadout-character-front.png" alt="角色流派预览" />
            <img class="character-portrait-drone" src="./assets/loadout-drone.png" alt="" />
          </div>

          <nav class="character-bottom-tabs" aria-label="角色信息标签">
            <button class="active" type="button" data-character-tab="weapons">武器</button>
            <button type="button" data-character-tab="outfit">服饰</button>
            <button type="button" data-character-tab="skills">技能</button>
          </nav>

          <footer class="character-info-actions">
            <button class="edit-appearance" id="backToBossFromCharacterBtn" type="button">返回Boss选择</button>
            <button class="enter-battle" id="nextLoadoutFromCharacterBtn" type="button">挑战</button>
          </footer>
        </section>
      </section>

      <section class="prebattle-page loadout-page" data-prebattle-page="loadout" aria-label="搭配装备">
        <div class="loadout-hero">
          <img id="loadoutHeroImage" src="./assets/loadout-character-front.png" alt="角色预览" />
          <img class="loadout-drone" src="./assets/loadout-drone.png" alt="" />
          <div class="loadout-fixed-gourd" aria-label="前腰挂件：酒葫芦">
            <img src="./assets/loadout-gourd.jpeg" alt="" />
            <span>前腰</span>
          </div>
        </div>

        <nav class="loadout-parts" id="loadoutParts" aria-label="装备分页"></nav>
        <section class="loadout-armor-summary" id="loadoutArmorSummary" aria-label="战甲图形化说明"></section>

        <section class="attachment-panel" aria-label="装配槽位">
          <div class="attachment-slots" id="attachmentSlots"></div>
          <p class="attachment-title" id="attachmentTitle">选择挂件</p>
          <div class="attachment-items" id="attachmentItems"></div>
        </section>

        <footer class="prebattle-actions">
          <button class="edit-appearance" id="backToBossBtn" type="button">返回角色信息</button>
          <button class="save-loadout" type="button">保存方案</button>
        </footer>
      </section>

      <section class="prebattle-page weapon-page" data-prebattle-page="weapons" aria-label="武器搭配">
        <div class="weapon-page-hero">
          <img class="weapon-page-character" src="./assets/loadout-character-front.png" alt="武器搭配角色预览" />
          <img class="weapon-page-drone" src="./assets/loadout-drone.png" alt="" />
        </div>

        <section class="weapon-equip-panel" aria-label="武器选择">
          <div class="weapon-carry-slots" id="weaponCarrySlots"></div>
          <p class="weapon-selection-title" id="weaponSelectionTitle">选择携带武器：武器A</p>
          <div class="weapon-gallery" id="weaponGallery"></div>
        </section>
        <aside class="weapon-detail-panel" id="weaponDetailPanel" aria-label="武器技能装配"></aside>

        <footer class="weapon-page-actions">
          <button class="edit-appearance" id="backToCharacterFromWeaponBtn" type="button">编辑样式</button>
          <button class="save-loadout" type="button">保存</button>
        </footer>
      </section>

      <section class="prebattle-page skill-page" data-prebattle-page="skills" aria-label="技能配置">
        <section class="skill-config-shell">
          <header class="skill-config-head">
            <span>技能配置</span>
            <strong>按武器、战甲、挂件三类查看技能来源</strong>
          </header>

          <aside class="skill-config-loadout">
            <span>当前携带</span>
            <div class="skill-loadout-weapons" id="skillLoadoutWeapons"></div>
          </aside>

          <section class="skill-config-board">
            <nav class="skill-source-tabs" id="skillSourceTabs" aria-label="技能来源"></nav>
            <div class="skill-config-list" id="skillConfigList"></div>
          </section>

          <aside class="skill-editor" id="skillEditor" aria-label="技能编辑"></aside>

          <footer class="skill-config-actions">
            <button class="edit-appearance" id="backToLoadoutBtn" type="button">返回角色主界面</button>
            <button class="enter-battle" id="enterBattleBtn" type="button">进入挑战</button>
          </footer>
        </section>
      </section>
    </section>

    <main class="app-shell is-hidden" id="battleApp">
      <section class="stage-area">
        <header class="topbar">
          <div>
            <h1>M98 2D 回合战斗验证</h1>
            <p>玩家回合可切换武器并选择技能；技能按武器、攻击部位、单体/AOE 标签分类。</p>
          </div>
          <div class="battle-state">
            <span id="phaseLabel">玩家回合</span>
            <button id="resetBtn" type="button">重开</button>
          </div>
        </header>

        <div class="battle-frame">
          <canvas id="battleCanvas" width="1366" height="768" aria-label="2D 战斗验证画面"></canvas>
          <div class="weapon-overlay" id="weaponOverlay">
            <button class="weapon-toggle" id="weaponToggle" type="button" aria-label="武器切换" aria-expanded="false"></button>
            <div class="weapon-dock">
              <div class="weapon-list" id="weaponButtons"></div>
            </div>
          </div>
          <div class="battle-skill-overlay" id="battleSkillOverlay" aria-label="战斗技能栏">
            <div class="battle-skill-list" id="battleSkillButtons"></div>
          </div>
          <button class="soul-armor-button" id="soulArmorButton" type="button" aria-label="灵魂战甲技能">
            <span class="soul-armor-core">
              <img src="./assets/soul-armor-skill.jpg?v=soul-armor-icon-20260618" alt="" />
              <strong id="soulArmorCount">0</strong>
            </span>
            <span class="soul-armor-dots" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </span>
          </button>
          <div class="video-overlay hidden" id="videoOverlay">
            <video id="skillVideo" playsinline muted preload="auto"></video>
            <div class="qte-overlay hidden" id="qteOverlay">
              <div class="qte-title" id="qteTitle">QTE</div>
              <div class="qte-copy" id="qteCopy">D 右闪 / W 格挡</div>
              <div class="qte-bar"><i id="qteGauge"></i></div>
            </div>
            <div class="accessory-choice hidden" id="accessoryChoice">
              <button class="accessory-choice-zone accessory-choice-top" type="button" data-accessory="jet">
                <span>喷气挂件</span>
              </button>
              <button class="accessory-choice-zone accessory-choice-bottom" type="button" data-accessory="drone">
                <span>无人机挂件</span>
              </button>
            </div>
          </div>
          <div class="weakpoint-tip hidden" id="weakpointTip">
            <img src="./assets/tips-avatar.png" alt="队友提示" />
            <div>
              <strong>队友提示</strong>
              <p>胸口核心已暴露，优先攻击弱点。</p>
            </div>
          </div>
        </div>

        <div class="timeline">
          <div>
            <span>当前回合</span>
            <div class="turn-pill" id="turnInfo">玩家行动</div>
          </div>
          <div>
            <span>Boss 状态</span>
            <div class="turn-pill enemy" id="bossInfo">阶段 1</div>
          </div>
          <div>
            <span>灵魂战甲</span>
            <div class="bar soul"><i id="soulGauge"></i></div>
          </div>
        </div>
      </section>

      <aside class="control-area">
        <div class="hidden" aria-hidden="true">
          <strong id="playerHp">--</strong>
          <strong id="selectedWeapon">--</strong>
          <strong id="turnState">--</strong>
          <strong id="currentTarget">--</strong>
          <strong id="brokenParts">--</strong>
          <div id="skillButtons"></div>
          <div id="soulSkillButtons"></div>
        </div>

        <section class="panel reaction hidden" id="reactionPanel">
          <h2>敌方攻击</h2>
          <p id="threatText">Boss 正在发动高威胁动作。</p>
          <div class="action-grid">
            <button data-react="block" type="button">W 格挡</button>
            <button data-react="left" type="button">A 左闪</button>
            <button data-react="right" type="button">D 右闪</button>
          </div>
        </section>

        <section class="panel log-panel">
          <h2>战斗记录</h2>
          <ol id="logList"></ol>
        </section>
      </aside>
    </main>

    <script src="./game.js?v=module-bingo-20260626"></script>
  </body>
</html>
